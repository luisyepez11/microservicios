version: '3.8'

services:
  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db  
      - DB_PORT=5442
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASS=As1qu1ro1-1
      - JWT_SECRET=123
      - SAL_ENCRYPT=123
      - RESEND_API_KEY=re_jM8owBCS_64GjW2bZvqRmsEHcHNT2oszs
      - RESEND_FROM_EMAIL=onboarding@resend.dev
    depends_on:
      - db
    command: >
      sh -c "sleep 10 && 
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=As1qu1ro1-1
    ports:
      - "5442:5442"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: