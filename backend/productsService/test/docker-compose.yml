version: '3'
services:
  app:
    build:
      context: .
      dockerfile: docker.dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www/http
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8002
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5633
      DB_DATABASE: microservices-db
      DB_USERNAME: postgres
      DB_PASSWORD: 0000

  db:
    image: postgres:16
    container_name: laravel_db
    environment:
      POSTGRES_DB: microservices-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
    ports:
      - "5633:5633"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
