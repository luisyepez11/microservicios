version: '3.8'

services:
  # --- SERVICIO: TU APLICACIÓN LARAVEL ---
  app:
    # Usa el Dockerfile que acabas de subir
    build:
      context: .
      dockerfile: docker.dockerfile
    image: laravel-postgres-app
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8000:8002" 
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8002"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432 
      DB_DATABASE: microservices-db
      DB_USERNAME: appuser    
      DB_PASSWORD: appsecret  
    volumes:
      - .:/var/www/http 
    depends_on:
      - db
    networks:
      - app-network

  # --- SERVICIO: BASE DE DATOS POSTGRESQL ---
  db:
    image: postgres:15-alpine
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: microservices-db
      POSTGRES_USER: appuser      
      POSTGRES_PASSWORD: appsecret  
      POSTGRES_ROOT_PASSWORD: root
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge